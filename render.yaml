services:
  - type: static_site
    name: six-hand-bid-euchre-client
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false

  - type: web
    name: six-hand-bid-euchre-server
    runtime: node
    rootDir: server
    buildCommand: npm ci && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: six-hand-bid-euchre-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:apps --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
